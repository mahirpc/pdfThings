<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pdfThings — a private PDF workbench</title>
<meta name="description" content="Open, edit, sign, and secure PDFs entirely in your browser. Nothing is uploaded, ever.">
<meta name="theme-color" content="#12161d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <button id="btnMenu" class="icon-btn only-mobile" title="Menu" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div class="brand" id="btnHome" title="pdfThings">
    <svg class="brand-stamp" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="#12161d"/>
      <path d="M13 9 h17 l6 6 v24 h-23 z" fill="#f1efe8"/>
      <path d="M30 9 v6 h6 z" fill="#d6d2c6"/>
      <rect x="16.5" y="20" width="16" height="3" rx="1.5" fill="#3a4048"/>
      <rect x="16.5" y="26" width="16" height="3" rx="1.5" fill="#3a4048"/>
      <rect x="16.5" y="32" width="10" height="3" rx="1.5" fill="#3a4048"/>
      <circle cx="32" cy="33" r="9.5" fill="#1b7a72" stroke="#d69e2e" stroke-width="1.6"/>
      <path d="M27.5 33.3 L30.5 36.5 L37 28.5" fill="none" stroke="#f1efe8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-word">pdf<em>Things</em></span>
  </div>

  <div class="doc-name only-desktop" id="docNameWrap">
    <span id="docName">No document open</span>
    <span class="dirty-dot" id="dirtyDot" hidden></span>
  </div>

  <div class="topbar-spacer"></div>

  <div class="topbar-group only-desktop">
    <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg>
    </button>
  </div>

  <div class="topbar-group only-desktop" id="zoomGroup">
    <button class="icon-btn" id="btnZoomOut" title="Zoom out">−</button>
    <button class="zoom-label" id="zoomLabel" title="Fit width">Fit</button>
    <button class="icon-btn" id="btnZoomIn" title="Zoom in">+</button>
  </div>

  <button class="icon-btn" id="btnDark" title="Toggle dark mode">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <button class="btn btn-primary" id="btnSave" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/></svg>
    <span>Save</span>
  </button>
</header>

<!-- ============ APP BODY ============ -->
<div class="app-body">

  <!-- Left tool rail -->
  <nav class="rail" id="rail">
    <button class="rail-btn active" data-panel="view" title="View">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>View</span>
    </button>
    <button class="rail-btn" data-panel="pages" title="Pages">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="16" rx="1.5"/><path d="M8 21h12V7"/></svg>
      <span>Pages</span>
    </button>
    <button class="rail-btn" data-panel="annotate" title="Annotate">
      <svg viewBox="0 0 24 24"><path d="M4 20l4.5-1.2L19.8 7.5a2 2 0 0 0 0-2.8l-.5-.5a2 2 0 0 0-2.8 0L5.2 15.5 4 20Z"/></svg>
      <span>Annotate</span>
    </button>
    <button class="rail-btn" data-panel="stamps" title="Stamps &amp; signatures">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6.5"/><path d="M8.2 8.7 11 11.5l4.6-4.6M9 15.5 6 21l6-2 6 2-3-5.5"/></svg>
      <span>Sign</span>
    </button>
    <button class="rail-btn" data-panel="forms" title="Forms">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
      <span>Forms</span>
    </button>
    <button class="rail-btn" data-panel="ocr" title="OCR">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 9h2M7 13h6M15 9h2M15 13h2"/></svg>
      <span>OCR</span>
    </button>
    <button class="rail-btn" data-panel="ai" title="Text tools">
      <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>
      <span>Text&nbsp;tools</span>
    </button>
    <button class="rail-btn" data-panel="security" title="Security">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5.5V11c0 5.2 3.4 9.7 8 11 4.6-1.3 8-5.8 8-11V5.5Z"/><path d="M9.5 12.2 11.3 14l3.4-3.6"/></svg>
      <span>Security</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-panel="settings" title="Settings &amp; about">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.6-2-3.4-2.4.7a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 2.7a8 8 0 0 0-2.6 1.5l-2.4-.7-2 3.4L4.6 10.5a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.7a8 8 0 0 0 2.6 1.5L10 22h4l.4-2.7a8 8 0 0 0 2.6-1.5l2.4.7 2-3.4Z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- Page thumbnails -->
  <aside class="thumb-rail" id="thumbRail">
    <div class="thumb-rail-head">
      <span>Pages</span>
      <button class="icon-btn small" id="btnCollapseThumbs" title="Collapse">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="thumb-list" id="thumbList"></div>
  </aside>

  <!-- Main canvas viewport -->
  <main class="viewport" id="viewport">

    <div class="empty-state" id="emptyState">
      <div class="empty-card" id="dropZone">
        <svg class="empty-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M16 8h24l12 12v36H16z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M40 8v12h12" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M22 33h20M22 40h20M22 47h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Your PDF workbench.<br>Nothing leaves this tab.</h1>
        <p>Open, mark up, sign, and lock down PDFs entirely on this device — no upload, no account, works offline once installed.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" id="btnOpenFile">Open a PDF</button>
          <span class="empty-or">or drop a file anywhere</span>
        </div>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>

      <div class="recents" id="recentsWrap" hidden>
        <h2>Recent</h2>
        <ul class="recents-list" id="recentsList"></ul>
      </div>
    </div>

    <div class="page-scroller" id="pageScroller" hidden></div>

    <div class="floating-toolbar" id="floatingToolbar" hidden></div>
  </main>

  <!-- Right context panel -->
  <aside class="context-panel" id="contextPanel">
    <div class="ctx-head">
      <h2 id="ctxTitle">View</h2>
      <button class="icon-btn small only-mobile" id="btnCloseCtx">✕</button>
    </div>
    <div class="ctx-body" id="ctxBody"></div>
  </aside>

</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<!-- ============ LIBRARIES ============ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.7/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib-plus-encrypt@1.1.0/dist/pdf-lib-plus-encrypt.iife.js"></script>
<script>
  (function () {
    var missing = [];
    if (typeof window.pdfjsLib === 'undefined') missing.push('pdf.js');
    if (typeof window.PDFLib === 'undefined') missing.push('pdf-lib');
    if (typeof window.Sortable === 'undefined') missing.push('Sortable');
    if (!missing.length) return;
    var banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0e1116;color:#e9e8e2;' +
      'display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;';
    banner.innerHTML = '<div style="max-width:380px;"><h1 style="font-size:18px;margin-bottom:10px;">Couldn\'t load ' + missing.join(', ') +
      '</h1><p style="color:#8b93a3;font-size:14px;line-height:1.6;">This usually means the connection dropped mid-load, or a network/ad-blocker is stopping requests to cdnjs.cloudflare.com or cdn.jsdelivr.net. Check your connection and reload.</p>' +
      '<button onclick="location.reload()" style="margin-top:16px;background:#1b7a72;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;cursor:pointer;">Reload</button></div>';
    document.body.appendChild(banner);
  })();
</script>

<!-- ============ APP ============ -->
<script src="js/db.js"></script>
<script src="js/pdf-tools.js"></script>
<script src="js/annotate.js"></script>
<script src="js/forms.js"></script>
<script src="js/ocr.js"></script>
<script src="js/ai.js"></script>
<script src="js/thumbnails.js"></script>
<script src="js/app.js"></script>
</body>
</html>
